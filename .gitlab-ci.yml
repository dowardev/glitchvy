# ============================================================
# glitchvy monorepo — GitLab CI
# https://docs.gitlab.com/ee/ci/
# ============================================================

stages:
  - lint
  - test
  - build
  - deploy
  - rollback

# Shared settings
default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  GIT_DEPTH: "10"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer"

# ============================================================
# Lint stage
# ============================================================

lint:sdk:
  stage: lint
  image: node:22-alpine
  before_script:
    - corepack enable
  script:
    - pnpm --filter @dowardev/glitchvy lint || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    # The tag pipeline runs the checks too: the deploy stage needs them.
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$/'

lint:server:
  stage: lint
  image: php:8.3-cli
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git unzip
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - php composer-setup.php --install-dir=/usr/local/bin --filename=composer
    - rm composer-setup.php
  script:
    - composer -d back validate --strict --no-check-publish
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    # The tag pipeline runs the checks too: the deploy stage needs them.
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$/'

# ============================================================
# Test stage
# ============================================================

test:sdk:
  stage: test
  image: node:22-alpine
  needs: []
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile || pnpm install
  script:
    - pnpm --filter @dowardev/glitchvy test:run
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    # The tag pipeline runs the checks too: the deploy stage needs them.
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$/'

test:admin:
  stage: test
  image: node:22-alpine
  needs: []
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile || pnpm install
  script:
    - pnpm --filter glitchvy-admin test:unit --run
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    # The tag pipeline runs the checks too: the deploy stage needs them.
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$/'

test:server:
  stage: test
  image: php:8.3-cli
  needs: []
  services:
    - name: mysql:8.0
      alias: mysql
      variables:
        MYSQL_ROOT_PASSWORD: "root"
        MYSQL_DATABASE: "glitchvy_test"
        MYSQL_USER: "glitchvy"
        MYSQL_PASSWORD: "glitchvy"
  variables:
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: "glitchvy_test"
    DB_USERNAME: "glitchvy"
    DB_PASSWORD: "glitchvy"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git unzip libzip-dev default-mysql-client
    - docker-php-ext-install pdo_mysql zip
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - php composer-setup.php --install-dir=/usr/local/bin --filename=composer
    - rm composer-setup.php
    - composer -d back install --prefer-dist --no-progress --no-interaction
  script:
    - cd back && vendor/bin/phpunit
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    # The tag pipeline runs the checks too: the deploy stage needs them.
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$/'

test:deploy-tooling:
  stage: test
  image: bash:5.2
  needs: []
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - git config --global user.email "ci@glitchvy.test"
    - git config --global user.name "CI"
  script:
    # The deployment tooling has its own test suite: the rollback tag
    # selection, the env file writer, the destructive migration guard and
    # the tarball exclusions.
    - bash scripts/deploy/tests/run-tests.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$/'

# ============================================================
# Build stage (release-only)
# ============================================================

build:packages:
  stage: build
  image: node:22-alpine
  needs: []
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile || pnpm install
  script:
    - pnpm --filter @dowardev/glitchvy build
    - pnpm --filter glitchvy-admin build
  artifacts:
    paths:
      - packages/sdk/dist
      - front/dist
    expire_in: 1 month
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

# ============================================================
# Deploy & rollback stages (tag-only)
# ============================================================
# The deploy needs these GitLab CI/CD variables (Settings > CI/CD > Variables):
#   SSH_HOST, SSH_PORT, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS,
#   DEPLOY_PATH_BACKEND, DEPLOY_PATH_FRONTEND
# The npm SDK (@dowardev/glitchvy) is published by a separate release flow.

.tag_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$/'

.ssh_setup:
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    # A malformed key fails here, with a clear message, instead of at the
    # first connection with an opaque error.
    - ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa

# Files that must never be shipped: the environment files (the server keeps
# its own .env), the local dev database and the generated caches.
backend_deploy:
  stage: deploy
  image: alpine:3.20
  extends: [.ssh_setup, .tag_rules]
  needs:
    - lint:server
    - test:server
  script:
    - |
      tar -czf /tmp/backend.tar.gz \
        --exclude='.git' \
        --exclude='node_modules' \
        --exclude='vendor' \
        --exclude='.env' \
        --exclude='.env.*' \
        --exclude='storage/logs/*' \
        --exclude='storage/app/*' \
        --exclude='storage/framework/cache/*' \
        --exclude='storage/framework/sessions/*' \
        --exclude='storage/framework/views/*' \
        --exclude='bootstrap/cache/*.php' \
        --exclude='database/database.sqlite' \
        -C back .
    - scp -P "$SSH_PORT" /tmp/backend.tar.gz "$SSH_USER@$SSH_HOST:/tmp/backend.tar.gz"
    - |
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        set -e
        mkdir -p $DEPLOY_PATH_BACKEND &&
        tar -xzf /tmp/backend.tar.gz -C $DEPLOY_PATH_BACKEND &&
        cd $DEPLOY_PATH_BACKEND &&
        mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/app/private &&
        chmod -R 775 storage bootstrap/cache &&
        composer install --no-dev --optimize-autoloader --no-interaction &&
        php artisan config:cache &&
        php artisan route:cache &&
        rm /tmp/backend.tar.gz
      "

# The migrations are a separate MANUAL job: a pending migration can drop a
# table or a column, and that must not run unattended on a tag push.
backend_migrate:
  stage: deploy
  image: alpine:3.20
  extends: [.ssh_setup, .tag_rules]
  when: manual
  needs:
    - backend_deploy
  script:
    - |
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        set -e
        cd $DEPLOY_PATH_BACKEND &&
        PENDING=\$(php artisan migrate --pretend --no-ansi 2>/dev/null || true) &&
        if echo \"\$PENDING\" | grep -qiE 'drop table|drop column|truncate|rename column'; then
          if [ \"\${ALLOW_DESTRUCTIVE_MIGRATIONS:-}\" != '1' ]; then
            echo 'Destructive migration detected. Review it, then set ALLOW_DESTRUCTIVE_MIGRATIONS=1 as a CI variable to apply it.' >&2;
            exit 1;
          fi;
          echo 'WARNING: applying a destructive migration (ALLOW_DESTRUCTIVE_MIGRATIONS=1)';
        fi &&
        php artisan migrate --force
      "

frontend_deploy:
  stage: deploy
  image: node:22-alpine
  extends: [.tag_rules]
  needs:
    - lint:sdk
    - test:sdk
    - test:admin
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    # A malformed key fails here, with a clear message, instead of at the
    # first connection with an opaque error.
    - ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - pnpm --filter glitchvy-admin build
    - tar -czf /tmp/frontend.tar.gz -C front/dist .
    - scp -P "$SSH_PORT" /tmp/frontend.tar.gz "$SSH_USER@$SSH_HOST:/tmp/frontend.tar.gz"
    - |
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        set -e
        mkdir -p $DEPLOY_PATH_FRONTEND &&
        tar -xzf /tmp/frontend.tar.gz -C $DEPLOY_PATH_FRONTEND &&
        rm /tmp/frontend.tar.gz
      "

rollback_backend:
  stage: rollback
  image: alpine:3.20
  extends: [.ssh_setup, .tag_rules]
  when: manual
  before_script:
    - !reference [.ssh_setup, before_script]
    - apk add --no-cache git
  script:
    - |
      # The newest stable release older than the tag being deployed. The
      # selection lives in one script so both rollback jobs agree on it.
      git fetch --tags
      # A manual override lets an operator pick the target during an
      # incident, when the automatic selection cannot find a candidate.
      PREVIOUS_TAG="${ROLLBACK_TO_TAG:-$(scripts/ci/previous-tag.sh "$CI_COMMIT_TAG")}"
      echo "Rolling back to $PREVIOUS_TAG"
      git checkout "$PREVIOUS_TAG" -- back/
      tar -czf /tmp/backend-rollback.tar.gz \
        --exclude='.git' \
        --exclude='node_modules' \
        --exclude='vendor' \
        --exclude='.env' \
        --exclude='.env.*' \
        --exclude='storage/logs/*' \
        --exclude='storage/app/*' \
        --exclude='storage/framework/cache/*' \
        --exclude='storage/framework/sessions/*' \
        --exclude='storage/framework/views/*' \
        --exclude='bootstrap/cache/*.php' \
        --exclude='database/database.sqlite' \
        -C back .
      scp -P "$SSH_PORT" /tmp/backend-rollback.tar.gz "$SSH_USER@$SSH_HOST:/tmp/backend-rollback.tar.gz"
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        set -e
        mkdir -p $DEPLOY_PATH_BACKEND &&
        tar -xzf /tmp/backend-rollback.tar.gz -C $DEPLOY_PATH_BACKEND &&
        cd $DEPLOY_PATH_BACKEND &&
        mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/app/private &&
        chmod -R 775 storage bootstrap/cache &&
        composer install --no-dev --optimize-autoloader --no-interaction &&
        php artisan config:cache &&
        php artisan route:cache &&
        rm /tmp/backend-rollback.tar.gz
      "
      # Verification: the job only reports success when the restored
      # application is actually in place and boots.
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        set -e
        test -f $DEPLOY_PATH_BACKEND/public/index.php &&
        cd $DEPLOY_PATH_BACKEND &&
        php artisan --version
      "

rollback_frontend:
  stage: rollback
  image: node:22-alpine
  extends: [.tag_rules]
  when: manual
  before_script:
    - apk add --no-cache openssh-client git
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    # A malformed key fails here, with a clear message, instead of at the
    # first connection with an opaque error.
    - ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa
    - corepack enable
  script:
    - |
      # The newest stable release older than the tag being deployed. The
      # selection lives in one script so both rollback jobs agree on it.
      git fetch --tags
      # A manual override lets an operator pick the target during an
      # incident, when the automatic selection cannot find a candidate.
      PREVIOUS_TAG="${ROLLBACK_TO_TAG:-$(scripts/ci/previous-tag.sh "$CI_COMMIT_TAG")}"
      echo "Rolling back to $PREVIOUS_TAG"
      git checkout "$PREVIOUS_TAG" -- front/
      pnpm install --frozen-lockfile
      pnpm --filter glitchvy-admin build
      tar -czf /tmp/frontend-rollback.tar.gz -C front/dist .
      scp -P "$SSH_PORT" /tmp/frontend-rollback.tar.gz "$SSH_USER@$SSH_HOST:/tmp/frontend-rollback.tar.gz"
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        set -e
        mkdir -p $DEPLOY_PATH_FRONTEND &&
        tar -xzf /tmp/frontend-rollback.tar.gz -C $DEPLOY_PATH_FRONTEND &&
        rm /tmp/frontend-rollback.tar.gz
      "
      # Verification: the job only reports success when the restored build
      # is actually in place.
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        set -e
        test -f $DEPLOY_PATH_FRONTEND/index.html &&
        test -d $DEPLOY_PATH_FRONTEND/assets
      "
