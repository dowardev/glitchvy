# ============================================================
# glitchvy monorepo — GitLab CI
# https://docs.gitlab.com/ee/ci/
# ============================================================

stages:
  - lint
  - test
  - build

# Shared settings
default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  GIT_DEPTH: "10"
  # Cache paths are workspace-local.
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer"

# ============================================================
# Lint stage
# ============================================================

lint:sdk:
  stage: lint
  image: node:22-alpine
  before_script:
    - corepack enable
  script:
    - pnpm --filter glitchvy lint || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

lint:admin:
  stage: lint
  image: node:22-alpine
  before_script:
    - corepack enable
  script:
    - pnpm --filter glitchvy-admin lint || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

lint:server:
  stage: lint
  image: php:8.3-cli
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git unzip
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - php composer-setup.php --install-dir=/usr/local/bin --filename=composer
    - rm composer-setup.php
  script:
    - composer -C back validate --strict --no-check-publish
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ============================================================
# Test stage
# ============================================================

test:sdk:
  stage: test
  image: node:22-alpine
  needs: []
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile || pnpm install
  script:
    - pnpm --filter glitchvy test --coverage --run
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: packages/sdk/coverage/cobertura-coverage.xml
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

test:admin:
  stage: test
  image: node:22-alpine
  needs: []
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile || pnpm install
  script:
    - pnpm --filter glitchvy-admin test --coverage --run
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: front/coverage/cobertura-coverage.xml
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

test:server:
  stage: test
  image: php:8.3-cli
  needs: []
  services:
    - name: mysql:8.0
      alias: mysql
      variables:
        MYSQL_ROOT_PASSWORD: "root"
        MYSQL_DATABASE: "glitchvy_test"
        MYSQL_USER: "glitchvy"
        MYSQL_PASSWORD: "glitchvy"
  variables:
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: "glitchvy_test"
    DB_USERNAME: "glitchvy"
    DB_PASSWORD: "glitchvy"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git unzip libzip-dev default-mysql-client
    - docker-php-ext-install pdo_mysql zip
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - php composer-setup.php --install-dir=/usr/local/bin --filename=composer
    - rm composer-setup.php
    - composer -C back install --prefer-dist --no-progress --no-interaction
  script:
    - composer -C back test
  coverage: '/^\s*Lines:\s*([\d.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: back/coverage/cobertura-coverage.xml
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ============================================================
# Build stage (release-only)
# ============================================================

build:packages:
  stage: build
  image: node:22-alpine
  needs: []
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile || pnpm install
  script:
    - pnpm -r build
  artifacts:
    paths:
      - packages/sdk/dist
      - front/dist
    expire_in: 1 month
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
