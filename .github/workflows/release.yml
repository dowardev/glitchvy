# ============================================================
# glitchvy monorepo — GitHub Actions release pipeline
# Traducido desde el stage `build` de .gitlab-ci.yml
#
# En GitLab el job `build:packages` corria unicamente con tags
# semver (`vX.Y.Z`). En GitHub el filtro equivalente es
# `needs.release_gate.outputs.release == 'true'`.
# ============================================================

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSER_CACHE_DIR: ${{ github.workspace }}/back/.composer
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate de tag semver: las expresiones de GitHub Actions no tienen regex
  # (no existe `matches()`), asi que el filtro exacto de las tag rules de
  # GitLab (^vX.Y.Z con prerelease opcional) se evalua aqui en bash.
  # Salida `release`: 'true' solo para tags semver validas.
  release_gate:
    name: release_gate
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|dryrun)\.[0-9]+)?$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build_packages:
    name: build:packages
    runs-on: ubuntu-latest
    needs: [release_gate]
    if: startsWith(github.ref, 'refs/tags/') && needs.release_gate.outputs.release == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build SDK and admin app
        run: |
          pnpm --filter @dowardev/glitchvy build
          pnpm --filter glitchvy-admin build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-packages
          path: |
            packages/sdk/dist
            front/dist
          retention-days: 30

  # ============================================================
  # Publish stage
  # Publica los paquetes del monorepo. En GitLab NO habia jobs de
  # publish: la publicacion era manual, desde una maquina local. Esto la
  # automatiza con el mismo criterio que el deploy (solo tags de release
  # validas).
  #
  # - Reutiliza el build ya testeado (artifact), no recompila.
  # - No publica si esa version ya esta en el registro.
  # - Sin el secret NPM_TOKEN no publica: lo omite con un warning, para
  #   no dejar en rojo la corrida de release.
  # ============================================================
  publish_npm:
    name: publish:npm
    runs-on: ubuntu-latest
    needs: [release_gate, build_packages]
    if: startsWith(github.ref, 'refs/tags/') && needs.release_gate.outputs.release == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '11.3.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Download the tested build
        uses: actions/download-artifact@v4
        with:
          name: build-packages

      - name: Check the version against the npm registry
        id: version
        env:
          PACKAGE_DIR: packages/sdk
        run: |
          set -euo pipefail
          name=$(node -p "require('./$PACKAGE_DIR/package.json').name")
          version=$(node -p "require('./$PACKAGE_DIR/package.json').version")
          echo "package=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          published=$( { npm view "$name" versions --json 2>/dev/null || true; } | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => (raw += chunk));
            process.stdin.on("end", () => {
              try {
                const parsed = JSON.parse(raw);
                console.log(Array.isArray(parsed) ? parsed.join(" ") : String(parsed));
              } catch (error) {
                console.log("");
              }
            });
          ' )
          if [[ " $published " == *" $version "* ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "La version $version de $name ya esta publicada: se omite." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::warning::Falta el secret NPM_TOKEN: se omite la publicacion a npm"
            echo "Publicacion a npm omitida: falta el secret NPM_TOKEN" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm publish --provenance --access public

  # Publica el paquete de composer (dowardev/glitchvy-server) a Packagist.
  #
  # Packagist no se publica con un token: lee el codigo del repositorio.
  # Para un monorepo se usa un "subtree split": la subcarpeta del paquete
  # se sube a la rama `subtree-split` con un tag `<version>-subtree-split`
  # y Packagist la detecta sola. Como el paquete vive en este mismo repo,
  # el push usa el GITHUB_TOKEN del workflow (sin credenciales extra).
  publish_composer:
    name: publish:composer
    runs-on: ubuntu-latest
    needs: [release_gate]
    if: startsWith(github.ref, 'refs/tags/') && needs.release_gate.outputs.release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version against Packagist
        id: version
        env:
          PACKAGE_DIR: back
          PACKAGE_NAME: dowardev/glitchvy-server
        run: |
          set -euo pipefail
          version=$(grep -m1 '"version"' "$PACKAGE_DIR/composer.json" | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/' || true)
          if [[ -z "$version" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          published=$( { curl -sS "https://repo.packagist.org/p2/$PACKAGE_NAME.json" 2>/dev/null || true; } | grep -o '"version":"[^"]*"' | cut -d '"' -f 4 | tr '\n' ' ' )
          if [[ " $published " == *" $version "* ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "La version $version de $PACKAGE_NAME ya esta publicada: se omite." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the subtree split to Packagist
        if: steps.version.outputs.publish == 'true'
        env:
          PACKAGE_DIR: back
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix="$PACKAGE_DIR" -b subtree-split
          git push origin subtree-split
          # Se crean los dos tags (con y sin "v") porque Packagist no siempre
          # normaliza el prefijo del tag.
          git tag "$PACKAGE_VERSION-subtree-split" subtree-split
          git tag "v$PACKAGE_VERSION-subtree-split" subtree-split
          git push origin "$PACKAGE_VERSION-subtree-split" "v$PACKAGE_VERSION-subtree-split"
