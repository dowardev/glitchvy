# ============================================================
# glitchvy monorepo — GitHub Actions CI
# Traducido desde .gitlab-ci.yml (ver odd/tasks/github-migration-translation.md)
#
# Mapeo de jobs (nombre GitLab -> nombre GitHub, idéntico a propósito:
# los required status checks de main matchean por nombre exacto):
#   lint:sdk      -> lint:sdk
#   lint:server   -> lint:server
#   test:sdk      -> test:sdk
#   test:admin    -> test:admin
#   test:server   -> test:server
#   build:packages-> build:packages (en release.yml, solo tags)
# ============================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSER_CACHE_DIR: ${{ github.workspace }}/back/.composer
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Lint stage
  # ============================================================

  # Gate de tag semver: las expresiones de GitHub Actions no tienen regex
  # (no existe `matches()`), asi que el filtro exacto de las tag rules de
  # GitLab (^vX.Y.Z con prerelease opcional) se evalua aqui en bash.
  # Salida `release`: 'true' solo para tags semver validas.
  release_gate:
    name: release_gate
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|dryrun)\.[0-9]+)?$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  lint_sdk:
    name: lint:sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '11.3.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Lint SDK
        run: pnpm --filter @dowardev/glitchvy lint

  lint_server:
    name: lint:server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validate composer manifest
        run: composer -d back validate --strict --no-check-publish

  # ============================================================
  # Test stage
  # En GitLab estos jobs corrian en el stage `test`, es decir,
  # despues de `lint`. `needs` reproduce esa dependencia.
  # ============================================================

  test_sdk:
    name: test:sdk
    runs-on: ubuntu-latest
    needs: [lint_sdk, lint_server]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '11.3.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run SDK tests
        run: pnpm --filter @dowardev/glitchvy test:run

  test_admin:
    name: test:admin
    runs-on: ubuntu-latest
    needs: [lint_sdk, lint_server]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '11.3.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run admin unit tests
        run: pnpm --filter glitchvy-admin test:unit --run

  test_server:
    name: test:server
    runs-on: ubuntu-latest
    needs: [lint_sdk, lint_server]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: glitchvy_test
          MYSQL_USER: glitchvy
          MYSQL_PASSWORD: glitchvy
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: glitchvy_test
      DB_USERNAME: glitchvy
      DB_PASSWORD: glitchvy
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          extensions: zip, pdo_mysql

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            back/vendor
            back/.composer/cache
          key: composer-${{ hashFiles('back/composer.lock') }}
          restore-keys: composer-

      - name: Install composer dependencies
        run: composer -d back install --prefer-dist --no-progress --no-interaction

      - name: Run Laravel tests
        run: cd back && vendor/bin/phpunit
