# ============================================================
# glitchvy monorepo — pnpm workspaces
# https://pnpm.io/settings
# ============================================================
packages:
  - 'packages/*' # the SDK (npm `glitchvy`) — the only publishable package
  - 'front' # the admin SPA (Vue 3 + Ionic) — app, not published
  - 'examples/*'

allowBuilds:
  core-js: true
  esbuild: true
  vue-demi: true

# `back/` is a Laravel standalone app managed by composer, not pnpm.

# Whitelist of dependencies whose build/postinstall scripts are allowed to run.
# Pnpm 11+ reads this from pnpm-workspace.yaml (not package.json).
onlyBuiltDependencies:
  - 'esbuild'
  - 'vue-demi'
