# deploy.conf.example - glitchvy
# Project configuration for deploy.sh
# THIS FILE IS COMMITTED - it holds build config, paths, excludes and commands
# Copy to scripts/deploy/deploy.conf if you need local overrides (gitignored)

# ============================================================
# Project Type
# ============================================================
PROJECT_TYPE="fullstack"

# ============================================================
# Project Structure & Build Commands
# ============================================================
BACKEND_DIR="back"
FRONTEND_DIR="front"

# Files to exclude from the backend tarball.
# .env* keeps every environment file out of the artifact (the server keeps
# its own .env); database/database.sqlite is the local dev database and must
# never overwrite the production one.
BACKEND_ARTIFACT_EXCLUDES=".git node_modules vendor .env* storage/* bootstrap/cache/*.php database/database.sqlite"

# Remote commands after the extract (on the server).
# storage/framework/* is excluded from the tarball, so the framework dirs
# must be created on the server or Blade fails with "Please provide a valid
# cache path."
# NOTE: no `php artisan config:cache` here on purpose. The cached config
# freezes the values of the server env file, so a manual edit of the .env
# would be silently ignored. The route cache does not depend on them.
BACKEND_REMOTE_CMD="mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/app/private && chmod -R 775 storage bootstrap/cache && composer install --no-dev --optimize-autoloader --no-interaction && php artisan route:cache"

# Migrations are NOT part of the deploy: they only run when the operator asks
# for them (deploy.sh --migrate) or when the manual CI job backend_migrate is
# started. A destructive migration must never run unattended.
BACKEND_MIGRATE_CMD="php artisan migrate --force"

# Frontend build command (runs in the monorepo root, pnpm workspace)
FRONTEND_BUILD_CMD="pnpm install --frozen-lockfile && pnpm --filter glitchvy-admin build"

# Frontend dist directory (relative to the repo root)
FRONTEND_ARTIFACT_SOURCE="front/dist"

# ============================================================
# Setup Script (optional)
# ============================================================
# Repo-root first-run setup script. It is uploaded to the server app root and
# made executable, but NEVER executed automatically (it prompts for secrets).
SETUP_SCRIPT="setup.sh"

# ============================================================
# Version Check (optional, informational only)
# ============================================================
# The npm SDK is published by a separate release flow; this only reports
# whether the local version is already on the registry.
VERSION_CHECK_PKG="@dowardev/glitchvy"
VERSION_CHECK_FILE="packages/sdk/package.json"
